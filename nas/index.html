<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prix NAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Azeret+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* mêmes tokens que gta/index.html */
:root{
  --BG:#0B0B0D;--PANEL:#151518;--LINE:#34343C;--LINE2:#71717C;
  --TEXT:#F2F2F4;--TEXT2:#A0A0AB;--DIM:#8E8E9A;--ACCENT:#45A5FF;--TEXT_RGB:242,242,244;
  --GOOD:#4CC38A;--WARN:#F5C542;--BAD:#FF5C5C;
  --lit:rgba(var(--TEXT_RGB),.07);--lip:color-mix(in srgb,var(--BG) 70%,black);
  --sheen:linear-gradient(rgba(var(--TEXT_RGB),.025),transparent 60%);
  --MONO:"Azeret Mono",ui-monospace,monospace;--SANS:Inter,"Segoe UI",system-ui,sans-serif;--gut:32px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--BG);color:var(--TEXT);font:400 16px/1.55 var(--SANS)}
a{color:inherit}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--ACCENT);outline-offset:3px;border-radius:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 var(--gut)}
@media (max-width:640px){:root{--gut:16px}}
.top{border-bottom:1px solid var(--LINE)}
.top .wrap{min-height:64px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:800 18px var(--SANS);letter-spacing:-.01em;text-decoration:none}
.brand span{color:var(--DIM);font-weight:600}
.stamp{margin-left:auto;font:700 12px var(--MONO);letter-spacing:.06em;text-transform:uppercase;color:var(--DIM)}
main.wrap{padding-top:32px;padding-bottom:64px;display:grid;gap:20px}
.reco{padding:14px 16px;border-left:2px solid var(--ACCENT);background:rgba(69,165,255,.06)}
.reco b{display:block;font:700 11px var(--MONO);letter-spacing:.08em;text-transform:uppercase;color:var(--ACCENT);margin-bottom:2px}
.panel{padding:18px;border-radius:3px;background:var(--PANEL);background-image:var(--sheen);box-shadow:inset 0 1px 0 var(--lit),0 2px 0 var(--lip),inset 0 0 0 1px var(--LINE)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.step{font:700 11px var(--MONO);letter-spacing:.08em;text-transform:uppercase;color:var(--DIM)}
.head h2{font:800 20px/1.2 var(--SANS)}
.price{margin-left:auto;font:800 24px var(--SANS)}
.price small{font:600 13px var(--SANS);color:var(--TEXT2)}
.meta{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--TEXT2)}
.meta a{color:var(--TEXT)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:2px;border:1px solid currentColor;font:700 11px var(--MONO);letter-spacing:.06em;text-transform:uppercase}
.v-vraie{color:var(--GOOD)} .v-fausse{color:var(--BAD)} .v-neutre{color:var(--TEXT2)}
.chart{position:relative;margin-top:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:400 11px var(--MONO);fill:var(--DIM)}
.chart .ref{font:700 11px var(--MONO)}
.tip{position:absolute;pointer-events:none;padding:6px 8px;border-radius:3px;background:var(--BG);border:1px solid var(--LINE2);font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
.tip[hidden]{display:none}
.sc{margin-top:10px;padding:8px 12px;border:1px dashed var(--LINE2);border-radius:3px;font-size:14px;color:var(--TEXT2)}
.sc b{display:block;font:700 11px var(--MONO);letter-spacing:.08em;text-transform:uppercase;color:var(--DIM)}
.sc a{color:var(--TEXT)}
.stores{font-size:13px;color:var(--TEXT2)}
.stores li{margin:2px 0}
.avis{margin-top:14px;padding-top:12px;border-top:1px solid var(--LINE);font-size:15px}
.avis b{display:block;font:700 11px var(--MONO);letter-spacing:.08em;text-transform:uppercase;color:var(--DIM);margin-bottom:2px}
details{margin-top:10px;font-size:13px;color:var(--TEXT2)}
summary{cursor:pointer}
table{border-collapse:collapse;margin-top:6px;width:100%}
td,th{padding:4px 8px;border-bottom:1px solid var(--LINE);text-align:left}
td.n{text-align:right;font-family:var(--MONO)}
.empty{color:var(--DIM)}
.note{font-size:12px;color:var(--DIM)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../">Prix NAS <span>· veille quotidienne</span></a>
  <div class="stamp" id="stamp"></div>
</div></header>
<main class="wrap" id="app"><p class="empty">Chargement des prix…</p></main>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const eur = n => n == null ? '—' : n.toLocaleString('fr-BE', { style: 'currency', currency: 'EUR' });
const day = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-BE', { day: 'numeric', month: 'short' });
const VERDICT = { vraie: '✓ vraie promo', fausse: '⚠ fausse promo', neutre: '— neutre' };
const TEND = { baisse: '↘ en baisse', stable: '→ stable', hausse: '↗ en hausse' };

// Courbe du prix : une série (ligne accent), deux repères en pointillé (plus bas 30 j, médiane 90 j).
function chart(c) {
  const pts = (c.historique || []).filter(p => typeof p.prix === 'number').sort((a, b) => a.date.localeCompare(b.date));
  if (pts.length < 2) return `<p class="note">Courbe disponible après deux relevés (${pts.length} pour l'instant).</p>`;
  const W = 640, H = 200, L = 52, R = 12, T = 12, B = 26;
  const t = p => new Date(p.date + 'T12:00:00').getTime();
  const t0 = t(pts[0]), t1 = t(pts[pts.length - 1]) || t0 + 1;
  const vals = pts.map(p => p.prix).concat([c.plus_bas_30j, c.mediane_90j].filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .15 || hi * .05; lo -= pad; hi += pad;
  const x = p => L + (t(p) - t0) / ((t1 - t0) || 1) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  // médiane : étiquette au-dessus à droite ; plus bas : en dessous à gauche (jamais l'une sur l'autre)
  const ref = (v, label, dash, below) => v == null ? '' :
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--LINE2)" stroke-width="1" stroke-dasharray="${dash}"/>
     <text class="ref" x="${below ? L + 4 : W - R}" y="${below ? y(v) + 13 : y(v) - 5}" text-anchor="${below ? 'start' : 'end'}" fill="var(--TEXT2)">${label} ${eur(v)}</text>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p).toFixed(1)},${y(p.prix).toFixed(1)}`).join('');
  return `<div class="chart" data-id="${esc(c.id)}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du prix : ${pts.length} relevés du ${day(pts[0].date)} au ${day(pts[pts.length - 1].date)}">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--LINE)" stroke-width="1"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)} €</text>`).join('')}
      <text class="ax" x="${L}" y="${H - 6}">${day(pts[0].date)}</text>
      <text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${day(pts[pts.length - 1].date)}</text>
      ${ref(c.mediane_90j, 'médiane 90 j', '6 4', false)}${ref(c.plus_bas_30j, 'plus bas 30 j', '2 3', true)}
      <path d="${path}" fill="none" stroke="var(--ACCENT)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p => `<circle cx="${x(p)}" cy="${y(p.prix)}" r="4" fill="${p.source === 'externe' ? 'var(--PANEL)' : 'var(--ACCENT)'}" stroke="var(--ACCENT)" stroke-width="2"/>`).join('')}
      <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--LINE2)" visibility="hidden"/>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
    </svg>
    <div class="tip" hidden></div>
    <p class="note">● relevé de la veille · ○ historique externe (comparateur)</p>
  </div>`;
}

function hover(el, c) {
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = el.querySelector('.cross');
  const pts = (c.historique || []).filter(p => typeof p.prix === 'number').sort((a, b) => a.date.localeCompare(b.date));
  const dots = [...svg.querySelectorAll('circle')];
  const move = e => {
    const r = svg.getBoundingClientRect(), k = 640 / r.width, mx = (e.clientX - r.left) * k;
    let i = 0; dots.forEach((d, j) => { if (Math.abs(d.cx.baseVal.value - mx) < Math.abs(dots[i].cx.baseVal.value - mx)) i = j; });
    const d = dots[i], p = pts[i];
    cross.setAttribute('x1', d.cx.baseVal.value); cross.setAttribute('x2', d.cx.baseVal.value); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${eur(p.prix)}</b> · ${day(p.date)}${p.marchand ? ' · ' + esc(p.marchand) : ''}`;
    const dr = d.getBoundingClientRect(), er = el.getBoundingClientRect();
    tip.style.left = dr.left + dr.width / 2 - er.left + 'px'; tip.style.top = dr.top - er.top + 'px'; tip.hidden = false;
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
}

const note = n => typeof n === 'number' ? `<span title="Fiabilité du magasin, estimée par Claude">fiabilité ${n.toLocaleString('fr-BE')}/5</span>` : '';
const second = s => !s || s.prix == null ? '' :
  `<div class="sc"><b>Seconde chance</b>${eur(s.prix)} chez ${s.lien ? `<a href="${esc(s.lien)}" target="_blank" rel="noopener">${esc(s.marchand)} ↗</a>` : esc(s.marchand)}
   ${s.etat ? ` · ${esc(s.etat)}` : ''}${s.garantie ? ` · garantie ${esc(s.garantie)}` : ''}${typeof s.fiabilite === 'number' ? ` · fiabilité ${s.fiabilite.toLocaleString('fr-BE')}/5` : ''}</div>`;

function panel(c) {
  const m = c.meilleur || {};
  const rows = (c.historique || []).slice().sort((a, b) => b.date.localeCompare(a.date))
    .map(p => `<tr><td>${day(p.date)}</td><td class="n">${eur(p.prix)}</td><td>${esc(p.marchand)}</td><td>${p.source === 'externe' ? 'externe' : 'veille'}</td></tr>`).join('');
  return `<section class="panel">
    <div class="head">
      <span class="step">Étape ${+c.etape || '?'}</span>
      <h2>${esc(c.nom)}${c.quantite > 1 ? ` <small class="step">×${+c.quantite}</small>` : ''}</h2>
      <div class="price">${eur(m.prix)} <small>${c.quantite > 1 ? 'pièce' : ''}</small></div>
    </div>
    <div class="meta">
      ${m.lien ? `<a href="${esc(m.lien)}" target="_blank" rel="noopener">${esc(m.marchand)} · ${esc(m.modele)} ↗</a>` : `<span>${esc(m.marchand || 'pas encore relevé')}</span>`}
      ${note(m.fiabilite)}
      ${c.ancien_prix_affiche ? `<span>prix barré affiché : ${eur(c.ancien_prix_affiche)}</span>` : ''}
      <span>plus bas 30 j : ${eur(c.plus_bas_30j)}</span>
      <span>médiane 90 j : ${eur(c.mediane_90j)}</span>
      ${c.tendance ? `<span>${TEND[c.tendance] || esc(c.tendance)}</span>` : ''}
      ${c.verdict ? `<span class="badge v-${esc(c.verdict)}">${VERDICT[c.verdict] || esc(c.verdict)}</span>` : ''}
    </div>
    ${second(c.seconde_chance)}
    ${chart(c)}
    ${c.avis ? `<div class="avis"><b>Avis de Claude</b>${esc(c.avis)}</div>` : ''}
    ${rows ? `<details><summary>Voir les relevés en tableau</summary><table><thead><tr><th>Date</th><th>Prix</th><th>Marchand</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></details>` : ''}
  </section>`;
}

fetch('prix.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const list = (d.composants || []).slice().sort((a, b) => (a.etape || 9) - (b.etape || 9));
    document.getElementById('stamp').innerHTML = d.maj ? `Mis à jour le <b>${day(d.maj)}</b>` : '';
    document.getElementById('app').innerHTML =
      (d.recommandation ? `<div class="reco"><b>Recommandation du jour</b>${esc(d.recommandation)}</div>` : '') +
      (list.length ? list.map(panel).join('') : '<p class="empty">Pas encore de relevé : le premier passage arrive.</p>') +
      ((d.marchands || []).length ? `<section class="panel"><span class="step">Fiabilité des magasins (estimée par Claude, sur 5)</span><ul class="stores">${d.marchands.map(s => `<li><b>${esc(s.nom)}</b> : ${typeof s.fiabilite === 'number' ? s.fiabilite.toLocaleString('fr-BE') + '/5' : 'pas encore notée'}${s.pourquoi ? ' — ' + esc(s.pourquoi) : ''}</li>`).join('')}</ul></section>` : '') +
      '<p class="note">Prix unitaires livrés en Belgique, neufs, vendus et expédiés par le marchand. Une « fausse promo » = remise affichée alors que le prix n\'est pas sous sa médiane 90 jours, ou prix gonflé dans le mois avant la remise.</p>';
    list.forEach(c => { const el = document.querySelector(`.chart[data-id="${CSS.escape(c.id)}"]`); if (el) hover(el, c); });
  })
  .catch(() => { document.getElementById('app').innerHTML = '<p class="empty">Pas encore de relevé : le premier passage arrive.</p>'; });
</script>
</body>
</html>
