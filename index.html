<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Veilles de Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Azeret+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* mêmes tokens que gta/index.html */
:root{
  --BG:#0B0B0D;--PANEL:#151518;--LINE:#34343C;--LINE2:#71717C;
  --TEXT:#F2F2F4;--TEXT2:#A0A0AB;--DIM:#8E8E9A;--ACCENT:#45A5FF;--TEXT_RGB:242,242,244;
  --lit:rgba(var(--TEXT_RGB),.07);--lip:color-mix(in srgb,var(--BG) 70%,black);
  --sheen:linear-gradient(rgba(var(--TEXT_RGB),.025),transparent 60%);
  --MONO:"Azeret Mono",ui-monospace,monospace;--SANS:Inter,"Segoe UI",system-ui,sans-serif;
  --T:190ms;--EASE:cubic-bezier(.33,1,.68,1);--gut:32px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--BG);color:var(--TEXT);font:400 16px/1.55 var(--SANS)}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--ACCENT);outline-offset:3px;border-radius:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 var(--gut)}
.top{border-bottom:1px solid var(--LINE)}
.top .wrap{min-height:64px;display:flex;align-items:center}
.brand{font:800 18px var(--SANS);letter-spacing:-.01em}
main.wrap{padding-top:32px;padding-bottom:64px}
.eyebrow{display:flex;align-items:center;gap:12px;font:700 12px var(--MONO);letter-spacing:.08em;text-transform:uppercase;color:var(--DIM);margin:0 0 14px}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--LINE)}
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
@media (max-width:640px){:root{--gut:16px}}
.tile{--ring:var(--LINE2);display:flex;flex-direction:column;gap:10px;min-height:180px;padding:20px;text-decoration:none;color:var(--TEXT);
  border-radius:3px;background:var(--PANEL);background-image:var(--sheen);
  box-shadow:inset 0 1px 0 var(--lit),0 2px 0 var(--lip),inset 0 0 0 1px var(--ring);
  transition:transform 280ms cubic-bezier(.34,1.5,.64,1),box-shadow var(--T) var(--EASE)}
a.tile:hover,a.tile:focus-visible{--ring:var(--TEXT2);transform:translateY(-3px)}
a.tile:active{transform:translateY(1px)}
.tile h2{font:800 22px/1.2 var(--SANS);letter-spacing:-.01em}
.tile p{font-size:14px;color:var(--TEXT2)}
.tile .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--LINE);font:700 11px var(--MONO);letter-spacing:.08em;text-transform:uppercase;color:var(--DIM)}
a.tile .foot{color:var(--ACCENT)}
.tile.is-off{opacity:.6}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">Veilles de Claude</div></div></header>
<main class="wrap">
  <p class="eyebrow">Choisir une veille</p>
  <div class="deck">
    <a class="tile" href="gta/">
      <h2>GTA 6</h2>
      <p>Modding : outils, annonces, et ce que réclament les joueurs. Deux passages par semaine.</p>
      <span class="foot">Ouvrir →</span>
    </a>
    <div class="tile is-off" aria-disabled="true">
      <h2>Prix NAS</h2>
      <p>Disques, onduleur, SSD et mémoire : meilleurs prix et vraies promos. Un passage par jour.</p>
      <span class="foot">Bientôt</span>
    </div>
  </div>
</main>
</body>
</html>
